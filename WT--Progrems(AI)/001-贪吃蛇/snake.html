<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 - 10×10</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    h1 {
      color: #e6e6e6;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .info {
      display: flex;
      gap: 30px;
      color: #ccc;
      font-size: 18px;
    }

    .info span b {
      color: #4ecdc4;
    }

    canvas {
      background: #16213e;
      border: 3px solid #0f3460;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .tip {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>

  <div class="info">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="best">0</b></span>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="tip">使用方向键 / WASD 控制移动，按空格键重新开始</div>

  <script>
    const SIZE = 10;            // 网格大小 10×10
    const CELL = 40;            // 每个格子的像素
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    let snake, dir, nextDir, food, score, best, gameOver, timer;

    best = Number(localStorage.getItem('snake_best') || 0);
    bestEl.textContent = best;

    function init() {
      // 初始蛇：中间 3 节，方向向右
      snake = [
        { x: 5, y: 5 },
        { x: 4, y: 5 },
        { x: 3, y: 5 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreEl.textContent = score;
      placeFood();
      draw();
    }

    function placeFood() {
      const occupied = new Set(snake.map(c => c.x + ',' + c.y));
      const free = [];
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          if (!occupied.has(x + ',' + y)) free.push({ x, y });
        }
      }
      food = free[Math.floor(Math.random() * free.length)];
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 撞墙
      if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
        return endGame();
      }
      // 撞自己
      if (snake.some(c => c.x === head.x && c.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      // 吃到食物
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake_best', best);
        }
        if (snake.length === SIZE * SIZE) {
          return winGame();
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 网格线
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // 食物
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 6, 0, Math.PI * 2);
      ctx.fill();

      // 蛇
      snake.forEach((c, i) => {
        ctx.fillStyle = i === 0 ? '#4ecdc4' : '#3aa8a0';
        ctx.fillRect(c.x * CELL + 2, c.y * CELL + 2, CELL - 4, CELL - 4);
      });
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      drawOverlay('游戏结束', '按空格键重新开始');
    }

    function winGame() {
      gameOver = true;
      clearInterval(timer);
      drawOverlay('你赢了！🎉', '按空格键重新开始');
    }

    function drawOverlay(title, sub) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#ccc';
      ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 25);
    }

    function startLoop() {
      clearInterval(timer);
      timer = setInterval(step, 200);
    }

    function restart() {
      clearInterval(timer);
      init();
      startLoop();
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === ' ' || key === 'space') {
        e.preventDefault();
        if (gameOver) {
          restart();
        }
        return;
      }

      // 防止 180° 掉头
      const map = {
        arrowup:    { x: 0, y: -1 },
        w:          { x: 0, y: -1 },
        arrowdown:  { x: 0, y: 1 },
        s:          { x: 0, y: 1 },
        arrowleft:  { x: -1, y: 0 },
        a:          { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 },
        d:          { x: 1, y: 0 }
      };

      const nd = map[key];
      if (!nd) return;
      e.preventDefault();

      // 不能反方向移动
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      nextDir = nd;
    });

    init();
    startLoop();
  </script>
</body>
</html>
